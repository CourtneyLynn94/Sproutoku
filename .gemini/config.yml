# Gemini Code Assist settings for Sproutoku.
have_fun: false
ignore_patterns: []
code_review:
  disable: false
  # LOW, MEDIUM, HIGH or CRITICAL. MEDIUM skips nitpicks.
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true