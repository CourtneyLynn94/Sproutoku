name: CI

# When to run: on PRs into develop or master, and on pushes to them
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  core-checks:
    name: Core checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore tests/Sproutoku.Core.Tests/Sproutoku.Core.Tests.csproj

      - name: Lint (formatting)
        run: |
          dotnet format src/Sproutoku.Core/Sproutoku.Core.csproj --verify-no-changes --no-restore
          dotnet format tests/Sproutoku.Core.Tests/Sproutoku.Core.Tests.csproj --verify-no-changes --no-restore

      - name: Build (warnings fail the build)
        run: dotnet build tests/Sproutoku.Core.Tests/Sproutoku.Core.Tests.csproj --no-restore -warnaserror

      - name: Run unit tests
        run: dotnet test tests/Sproutoku.Core.Tests/Sproutoku.Core.Tests.csproj --no-build

  android-build:
    name: App build (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build the Android app
        run: dotnet build src/Sproutoku.App/Sproutoku.App.csproj -c Debug -p:CiTargetFramework=net10.0-android

  windows-build:
    name: App build (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build the Windows app
        run: dotnet build src/Sproutoku.App/Sproutoku.App.csproj -c Debug -p:CiTargetFramework=net10.0-windows10.0.19041.0
