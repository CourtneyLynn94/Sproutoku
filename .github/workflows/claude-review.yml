name: Claude review

# One Claude review when a pull request opens (or leaves draft), and another whenever the
# "claude-review" label is added. Not on every push, to save Claude usage.
# Runs on Courtney's Pro plan through the CLAUDE_CODE_OAUTH_TOKEN secret.
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

# A newer review of the same PR replaces one still running.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a small solo hobby game. Be brief: only raise things worth fixing.

            1. Read AGENTS.md first. Never flag anything it lists under "Deliberate decisions".
            2. Read the diff with `gh pr diff`. Open the changed files only as far as you need to understand them.
            3. Look for: bugs; game rules in App code that belong in Sproutoku.Core; rule or GameSession changes
               without unit tests; anything that could lose or corrupt saved progress; behavior that would differ
               between Android and Windows; UI that could leave the player stuck.
            4. Don't comment on formatting (dotnet format already checks it), and don't suggest renames or
               refactors that don't fix a problem.
            5. Post each problem as an inline comment on its line, saying what goes wrong and how to fix it.
               Then post one short summary with `gh pr comment`: how many problems you found, or that you found none.

            Never commit, push or change any files.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"